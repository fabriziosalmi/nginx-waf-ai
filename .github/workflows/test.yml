name: WAF AI Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # QUOTED: unquoted YAML reads 3.10 as the float 3.1 -> "Python 3.1 not found"
        python-version: ["3.9", "3.10", "3.11"]
    
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Cache dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt', '**/test-requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r test-requirements.txt
    
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 src --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings
        flake8 src --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics
    
    - name: Test with pytest (unit tests)
      run: |
        pytest tests/ -m "unit" --cov=src --cov-report=xml
    
    - name: Test with pytest (integration tests)
      run: |
        # Exit 5 means "no tests collected": the integration tests were written
        # against an API src/ never had and could not even be imported, so they
        # were removed until they are rewritten (see the linked issue). Any
        # other non-zero exit still fails the job.
        pytest tests/ -m "integration" --cov=src --cov-append --cov-report=xml || [ $? -eq 5 ]
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        # Best effort: a tokenless upload is rate-limited by Codecov (HTTP 429),
        # and a coverage upload should not decide whether the tests passed.
        fail_ci_if_error: false

  docker-test:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Build Docker image
      run: |
        docker build -t waf-ai:test .
    
    - name: Smoke test the image
      run: |
        # The image's own CMD, no override: a broken entrypoint must fail here.
        docker run -d --name waf-smoke -p 8000:8000 waf-ai:test
        for i in $(seq 1 30); do
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/health || true)
          [ "$code" = 200 ] && break
          sleep 2
        done
        docker logs waf-smoke
        [ "$code" = 200 ] || { echo "/health answered $code"; exit 1; }

    - name: Cleanup
      if: always()
      run: |
        docker rm -f waf-smoke || true
